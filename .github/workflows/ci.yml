name: CI

# Pull Request ごとにビルドとテストを実行する。main の ruleset でこのチェックを必須にする。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: テスト
        run: npm test
